name: Опубликовать сайт

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить проект
        uses: actions/checkout@v6

      - name: Установить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Собрать сайт
        run: npm run build

      - name: Подготовить пути для GitHub Pages
        run: |
          find dist -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' \) -print0 | xargs -0 sed -i 's|/images/|/hair-salon-site/images/|g; s|/favicon.svg|/hair-salon-site/favicon.svg|g'

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5

      - name: Загрузить готовый сайт
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
